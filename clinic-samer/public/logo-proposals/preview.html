<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clinic Samer — luxusní logo</title>
    <style>
      :root { --ink: #4a3f63; --muted: #857b96; --bg: #f3eff9; --lilac: #9b8bb8; }
      body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--ink); padding: 2rem 1.5rem 3rem; }
      h1 { margin: 0 0 0.35rem; font-size: 1.5rem; }
      p { color: var(--muted); max-width: 42rem; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.25rem; max-width: 1100px; margin-top: 1.5rem; }
      .card { background: #fff; border-radius: 1.25rem; padding: 1.5rem; border: 1px solid rgba(74,63,99,.08); box-shadow: 0 12px 32px rgba(110,98,136,.1); }
      .card.active { outline: 2px solid var(--lilac); }
      .card h2 { margin: 0 0 0.25rem; font-size: 1rem; }
      .tag { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; }
      .nav-mock { display: flex; align-items: center; gap: 0.75rem; padding: 0.85rem 1rem; background: rgba(247,245,251,.95); border-radius: 0.85rem; margin-bottom: 0.75rem; }
      .nav-mock img { width: 44px; height: 44px; object-fit: contain; }
      .nav-mock strong { display: block; font-size: 0.95rem; }
      .nav-mock span { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
      .large { width: 100%; max-height: 200px; object-fit: contain; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <h1>Luxusní logo — nasazeno</h1>
    <p>Elegantní serifové SA s jemným květem. Alternativy B a C v návrzích — napište, pokud chcete jinou.</p>
    <div class="grid">
      <article class="card active">
        <h2>✓ Serif SA + květ</h2>
        <p class="tag">Aktivní logo na webu</p>
        <div class="nav-mock">
          <img src="../logo-mark.png" alt="" />
          <div><strong>Clinic Samer</strong><span>Gynekologie · IVF · Praha</span></div>
        </div>
        <img class="large" src="../logo-mark.png" alt="" />
      </article>
      <article class="card">
        <h2>B · Obloukový rám</h2>
        <p class="tag">alternativa</p>
        <img class="large" src="luxury-b-arch.png" alt="" />
      </article>
      <article class="card">
        <h2>C · Lotos</h2>
        <p class="tag">alternativa</p>
        <img class="large" src="luxury-c-lotus.png" alt="" />
      </article>
    </div>
  </body>
</html>
